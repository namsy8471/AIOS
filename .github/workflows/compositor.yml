name: AIOS nested compositor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y libwayland-dev libegl1-mesa-dev libxkbcommon-dev weston xvfb xauth python3-pil
      - run: cargo build --locked --manifest-path compositor/Cargo.toml
      - name: Observe a Wayland app on the rendered output
        run: xvfb-run -a /usr/bin/python3 tests/compositor_output.py
