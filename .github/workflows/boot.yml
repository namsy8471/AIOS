name: Boot and save contract
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Boot the minimal Rust core on an emulated ARM64 Cortex-A53
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace rust:alpine sh -ec '
            apk add --no-cache bash coreutils cpio findutils gcc binutils linux-virt musl-dev qemu-system-aarch64 sudo python3 e2fsprogs e2fsprogs-extra
            bash scripts/boot-test.sh /boot/vmlinuz-virt
            bash scripts/arm64-document-disk.sh
          '
      - uses: actions/upload-artifact@v4
        with:
          name: aios-arm64-virt-initramfs
          path: |
            build/initramfs.gz
            build/serial.log
            build/arm64-disk-*.log
      - uses: actions/upload-artifact@v4
        with:
          name: aios-arm64-qemu-console
          path: build/arm64-console/
          if-no-files-found: error
  arm64-model:
    if: github.event_name == 'workflow_dispatch'
    needs: arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aios-arm64-qemu-console
          path: build/arm64-console
      - run: sudo apt-get update -qq && sudo apt-get install -y qemu-system-arm e2fsprogs
      - name: Apply a real local model response to the ARM64 disk
        run: |
          (cd build/arm64-console && sha256sum -c SHA256SUMS)
          cp build/arm64-console/starter.raw build/work.raw
          bash scripts/with-local-model.sh bash -eu <<'CHECK'
          timeout 240s python3 tests/arm64_document_disk.py build/arm64-console/arm64-console.sh build/work.raw 18080
          cat build/arm64-model-proof.json
          cd build/arm64-console
          cp starter.raw cli.raw
          timeout 180s python3 arm64_model.py cli.raw --instruction "문서 마지막에 '현장 확인' 한 줄을 추가해 줘." > saved.json
          timeout 60s python3 arm64_model.py cli.raw --show > reopened.json
          cmp saved.json reopened.json
          jq -e '.text == "작업 기록\n현장 확인"' reopened.json
          printf '%s\n' "끝에 '승인 요청' 한 줄을 추가해 줘." "끝에 '승인 완료' 한 줄을 추가해 줘." "" \
            | timeout 180s python3 arm64_model.py cli.raw --interactive > turns.jsonl
          jq -se 'length == 2 and .[0].text == "작업 기록\n현장 확인\n승인 요청" and
            .[1].text == (.[0].text + "\n승인 완료")' turns.jsonl
          timeout 60s python3 arm64_model.py cli.raw --show > reopened.json
          tail -1 turns.jsonl | cmp - reopened.json
          CHECK
      - uses: actions/upload-artifact@v4
        with:
          name: aios-arm64-model-proof
          path: build/arm64-model-proof.json
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test the host demo
        run: cargo test --locked
      - name: Boot the Rust init
        run: |
          devices=()
          if test -c /dev/kvm; then devices+=(--device /dev/kvm); fi
          docker run --rm "${devices[@]}" -v "$PWD:/workspace" -w /workspace rust:alpine sh -ec '
            apk add --no-cache bash coreutils cpio findutils gcc linux-virt musl-dev qemu-system-x86_64 sudo xorriso mtools dosfstools ovmf
            # Only the GRUB image tools and modules are needed on the container overlay.
            apk add --no-cache --no-scripts grub-bios grub-efi
            bash scripts/boot-test.sh /boot/vmlinuz-virt
            if test -c /dev/kvm; then
              bash scripts/boot-test.sh /boot/vmlinuz-virt kvm
            else
              echo "Runner has no KVM device; only the TCG boot was exercised."
            fi
            bash scripts/boot-iso.sh /boot/vmlinuz-virt build/initramfs.gz
          '
      - name: Publish firmware-tested boot image
        uses: actions/upload-artifact@v4
        with:
          name: aios-x86_64-boot
          path: build/firmware/
          if-no-files-found: error
