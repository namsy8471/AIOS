name: Boot and save contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Test the host demo
        run: cargo test --locked
      - name: Boot the Rust init
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace rust:alpine sh -ec '
            apk add --no-cache bash coreutils cpio findutils gcc linux-virt musl-dev qemu-system-x86_64 sudo
            bash scripts/boot-test.sh /boot/vmlinuz-virt
          '
