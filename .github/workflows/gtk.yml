name: Native editor save contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gtk:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build the Rust integration test
        run: cargo test --locked --no-run
      - name: Install accessibility and GUI test packages
        run: |
          sources="$RUNNER_TEMP/gui-packages.list"
          for suite in noble noble-updates noble-security; do
            echo "deb https://archive.ubuntu.com/ubuntu $suite main universe" >> "$sources"
          done
          options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-
                   -o Acquire::Retries=1 -o Acquire::https::Timeout=20)
          sudo apt-get "${options[@]}" update -qq
          sudo apt-get "${options[@]}" install -y --no-install-recommends at-spi2-core gir1.2-atspi-2.0 gir1.2-gtk-3.0 python3-gi python3-pyqt6 xvfb xauth dbus-x11 btrfs-progs weston bubblewrap
      - name: Observe dialogs and drive real editor saves
        timeout-minutes: 2
        run: |
          export PATH="/usr/bin:$PATH" QT_QPA_PLATFORM=xcb QT_LINUX_ACCESSIBILITY_ALWAYS_ON=1
          for case in gtk_modal_blocks_save gtk_editor qt_editor; do
            export XDG_RUNTIME_DIR="$(mktemp -d)"
            dbus-run-session -- xvfb-run -a "$HOME/.cargo/bin/cargo" test --locked "$case" -- --ignored --nocapture
          done
      - name: Cancel a saved edit and reopen it in a fresh GTK process
        run: |
          cargo build --locked
          python3 -m venv "$RUNNER_TEMP/mcp-env"
          "$RUNNER_TEMP/mcp-env/bin/pip" install -q -r runtime/requirements.txt
          image=$(mktemp "$RUNNER_TEMP/aios-gtk-XXXXXX")
          mountpoint=$(mktemp -d)
          truncate -s 256M "$image"
          mkfs.btrfs -q "$image"
          sudo mount -o loop "$image" "$mountpoint"
          trap 'sudo umount "$mountpoint"' EXIT
          sudo /usr/bin/python3 tests/gtk_recovery.py target/debug/aios "$mountpoint"
          sudo "$RUNNER_TEMP/mcp-env/bin/python" tests/mcp_document.py "$mountpoint/aios" "$mountpoint"
  windows:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --test editor_task -- --ignored --nocapture
