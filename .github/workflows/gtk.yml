name: GTK save observation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gtk:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build the Rust integration test
        run: cargo test --locked --no-run
      - name: Observe a GTK save dialog and check the file
        run: |
          sudo apt-get -o Acquire::Retries=1 update -qq
          sudo apt-get install -y --no-install-recommends at-spi2-core gir1.2-atspi-2.0 gir1.2-gtk-3.0 python3-gi xvfb xauth dbus-x11
          PATH="/usr/bin:$PATH" GTK_A11Y=1 NO_AT_BRIDGE=0 dbus-run-session -- xvfb-run -a "$HOME/.cargo/bin/cargo" test --locked gtk_modal_blocks_save -- --ignored --nocapture
