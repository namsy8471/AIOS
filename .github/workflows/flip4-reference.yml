name: Flip4 reference kernel probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned community kernel
        run: |
          mkdir -p build/flip4
          curl -fsSL --retry 3 https://raw.githubusercontent.com/rainbowdashh/android_device_samsung_b4q/fbe65008eff1589606ee3164a0ef91ef8b124894/prebuilt/kernel -o build/flip4/kernel
          echo '532c5c371892f23fe8b68408a4aa4febc451afc62e25e680c94b548bd2d04fa1  build/flip4/kernel' | sha256sum -c -
      - name: Attempt a diskless boot on QEMU virt
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace rust:alpine sh -ec '
            apk add --no-cache bash coreutils cpio findutils gcc binutils musl-dev python3 qemu-system-aarch64 e2fsprogs dtc parted
            cargo build --locked --release --target aarch64-unknown-linux-musl
            bash scripts/arm64-early-init.sh build/flip4/kernel build/flip4/probe
            bash scripts/arm64-early-init.sh build/flip4/kernel build/flip4/pstore pstore
            bash scripts/arm64-early-init.sh build/flip4/kernel build/flip4/document document
            bash scripts/arm64-early-init.sh build/flip4/kernel build/flip4/bundle disk
            cp build/flip4/kernel scripts/flip4_model.py scripts/arm64_model.py scripts/model_mvp.py build/flip4/bundle/
            bash scripts/arm64-early-init.sh build/flip4/kernel build/flip4/split split-disk
            timeout 90s python3 tests/flip4_split_disk.py build/flip4/bundle build/flip4/split/split.raw > build/flip4/split/proof.json
            cd build/flip4/bundle
            sha256sum kernel starter.raw *.py > SHA256SUMS
          '
      - name: Assemble the Android v2 diagnostic image and boot its extracted payloads
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mkbootimg qemu-system-arm
          curl -fsSL --retry 3 https://github.com/rainbowdashh/android_device_samsung_b4q/releases/download/V2/twrp_b4q_V2.img -o build/flip4/recovery.img
          echo '2c1690936c2ce795da109d0796cc9b003eebcaa3b2da6dbc016e1c2331d0ee84  build/flip4/recovery.img' | sha256sum -c -
          bash scripts/flip4-reference-image.sh build/flip4/recovery.img build/flip4/pstore build/flip4/reference-image
      - uses: actions/upload-artifact@v4
        with:
          name: flip4-reference-unsigned
          path: build/flip4/reference-image/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip4-reference-probe-log
          path: |
            build/flip4/*/console.log
            build/flip4/split/console-*.log
            build/flip4/split/proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: flip4-virtual-disk
          path: build/flip4/bundle/
  model:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flip4-virtual-disk
          path: build/flip4
      - run: sudo apt-get update -qq && sudo apt-get install -y qemu-system-arm e2fsprogs
      - run: |
          cd build/flip4
          sha256sum -c SHA256SUMS
          cp starter.raw work.raw
          cp starter.raw offline.raw
          printf '%s\n' "장보기 메모에 '사과 두 개' 추가해 줘." '메모 보여줘' '' |
            timeout 60s python3 flip4_model.py offline.raw --offline --interactive > offline.jsonl
          jq -se 'length == 2 and .[0].text == "장보기\n사과 두 개" and .[0] == .[1]' offline.jsonl
          if timeout 60s python3 flip4_model.py offline.raw --offline --instruction "메모 삭제해 줘" > /dev/null 2> reject.log; then exit 1; fi
          grep -F 'AIOS_REJECT invalid-request' reject.log
          timeout 60s python3 flip4_model.py offline.raw --show > offline-reopened.json
          tail -1 offline.jsonl | cmp - offline-reopened.json
          bash ../../scripts/with-local-model.sh bash -eu <<'CHECK'
          timeout 180s python3 ../../tests/flip4_disk.py . work.raw .
          timeout 180s python3 flip4_model.py work.raw --instruction "메모 끝에 '빵' 한 줄을 추가해 줘." > edited.json
          timeout 60s python3 flip4_model.py work.raw --show > reopened.json
          cmp edited.json reopened.json
          jq -e '.text == "장보기\n우유\n전원 중단 검증\n빵"' reopened.json
          sha256sum -c SHA256SUMS
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip4-model-result
          path: |
            build/flip4/proof.json
            build/flip4/offline.jsonl
            build/flip4/disk-*.log
  guest-model:
    needs: probe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flip4-virtual-disk
          path: build/flip4
      - run: sudo apt-get update -qq && sudo apt-get install -y qemu-system-arm e2fsprogs ninja-build
      - run: bash scripts/flip4-model-disk.sh build/flip4 build/flip4/model.raw
      - name: Infer and save in the disconnected ARM64 guest
        run: |
          cd build/flip4
          cp --sparse=always model.raw inference-work.raw
          printf '%s\n' "장보기 메모에 '사과 두 개' 추가해 줘." "메모에 '우유'를 적어줘." "메모 보여줘" '' |
            timeout 600s python3 flip4_model.py inference-work.raw --guest-model --interactive > inferred.jsonl 2> usage.json
          jq -se 'length == 3 and .[0].text == "장보기\n사과 두 개" and .[1].text == "장보기\n사과 두 개\n우유" and .[1] == .[2]' inferred.jsonl
          jq -se 'length == 1 and .[0].model_peak_rss_kib > 0 and .[0].inference_ms > 0' usage.json
          timeout 60s python3 flip4_model.py inference-work.raw --show > reopened.json
          tail -1 inferred.jsonl | cmp - reopened.json
      - uses: actions/upload-artifact@v4
        with:
          name: flip4-guest-inference
          path: |
            build/flip4/inferred.jsonl
            build/flip4/usage.json
      - run: cd build/flip4 && sha256sum model.raw > MODEL_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: flip4-guest-model-disk
          retention-days: 7
          path: |
            build/flip4/model.raw
            build/flip4/MODEL_SHA256SUMS
