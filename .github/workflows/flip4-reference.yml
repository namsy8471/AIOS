name: Flip4 reference kernel probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned community kernel
        run: |
          mkdir -p build/flip4
          curl -fsSL --retry 3 https://raw.githubusercontent.com/rainbowdashh/android_device_samsung_b4q/fbe65008eff1589606ee3164a0ef91ef8b124894/prebuilt/kernel -o build/flip4/kernel
          echo '532c5c371892f23fe8b68408a4aa4febc451afc62e25e680c94b548bd2d04fa1  build/flip4/kernel' | sha256sum -c -
      - name: Attempt a diskless boot on QEMU virt
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace rust:alpine sh -ec '
            apk add --no-cache bash coreutils cpio findutils gcc binutils musl-dev python3 qemu-system-aarch64 e2fsprogs dtc parted
            cargo build --locked --release --target aarch64-unknown-linux-musl
            bash scripts/arm64-early-init.sh build/flip4/kernel build/flip4/probe
            bash scripts/arm64-early-init.sh build/flip4/kernel build/flip4/pstore pstore
            bash scripts/arm64-early-init.sh build/flip4/kernel build/flip4/document document
            bash scripts/arm64-early-init.sh build/flip4/kernel build/flip4/bundle disk
            cp build/flip4/kernel scripts/flip4_model.py scripts/arm64_model.py scripts/model_mvp.py build/flip4/bundle/
            bash scripts/arm64-early-init.sh build/flip4/kernel build/flip4/split split-disk
            bash scripts/arm64-early-init.sh build/flip4/kernel build/flip4/board-probe-init flip4-board-probe
            cp build/flip4/split/split.raw build/flip4/bundle/split-starter.raw
            timeout 90s python3 tests/flip4_split_disk.py build/flip4/bundle build/flip4/split/split.raw > build/flip4/split/proof.json
            cd build/flip4/bundle
            sha256sum kernel starter.raw split-starter.raw *.py > SHA256SUMS
          '
      - name: Boot the extracted diagnostic and document payloads, with and without recovery drivers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cpio gcc libc6-dev mkbootimg qemu-system-arm
          curl -fsSL --retry 3 https://github.com/rainbowdashh/android_device_samsung_b4q/releases/download/V2/twrp_b4q_V2.img -o build/flip4/recovery.img
          echo '2c1690936c2ce795da109d0796cc9b003eebcaa3b2da6dbc016e1c2331d0ee84  build/flip4/recovery.img' | sha256sum -c -
          bash scripts/flip4-reference-image.sh build/flip4/recovery.img build/flip4/pstore build/flip4/reference-image build/flip4/split build/flip4/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: flip4-reference-unsigned
          path: build/flip4/reference-image/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip4-reference-probe-log
          path: |
            build/flip4/*/console.log
            build/flip4/split/console-*.log
            build/flip4/split/proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: flip4-virtual-disk
          path: build/flip4/bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: flip4-board-probe-init
          path: build/flip4/board-probe-init/board-probe-init.cpio.gz
          if-no-files-found: error
  board-candidate:
    needs: probe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flip4-reference-unsigned
          path: build/flip4/reference-image
      - uses: actions/download-artifact@v4
        with:
          name: flip4-virtual-disk
          path: build/flip4/bundle
      - uses: actions/download-artifact@v4
        with:
          name: flip4-board-probe-init
          path: build/flip4/board-probe-init
      - name: Build the offline CAPE board candidate
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cpio device-tree-compiler gcc libc6-dev mkbootimg qemu-system-arm
          bundle=build/flip4
          recovery="$bundle/recovery.img"
          (cd "$bundle/reference-image" && sha256sum -c SHA256SUMS)
          (cd "$bundle/bundle" && sha256sum -c SHA256SUMS)
          curl -fsSL --retry 3 https://github.com/rainbowdashh/android_device_samsung_b4q/releases/download/V2/twrp_b4q_V2.img -o "$recovery"
          echo "2c1690936c2ce795da109d0796cc9b003eebcaa3b2da6dbc016e1c2331d0ee84  $recovery" | sha256sum -c -
          unpack_bootimg --boot_img "$bundle/reference-image/aios-flip4-document-reference-unsigned.img" --out "$bundle/document"
          bash scripts/flip4-reference-image.sh --board-image "$recovery" \
            "$bundle/document/ramdisk" "$bundle/reference-board"
      - name: Test the board module set and document persistence on QEMU virt
        run: |
          bundle=build/flip4/bundle
          board=build/flip4/reference-board
          cp --sparse=always "$bundle/split-starter.raw" "$board/work.raw"
          timeout 180s python3 tests/flip4_split_disk.py "$bundle" "$board/work.raw" "$board/payload" \
            --driver-order "$board/order.txt" > "$board/proof.json"
      - name: Verify the diskless board diagnostic on QEMU virt
        run: |
          bundle=build/flip4
          probe="$bundle/native-board-probe"
          bash scripts/flip4-reference-image.sh --board-probe "$bundle/recovery.img" \
            "$bundle/board-probe-init/board-probe-init.cpio.gz" "$probe"
          timeout 90s python3 tests/flip4_board_boot.py "$probe" > "$probe/qemu-proof.json"
      - uses: actions/upload-artifact@v4
        with:
          name: flip4-board-diagnostics
          path: |
            build/flip4/native-board-probe/aios-flip4-board-probe-unsigned.img
            build/flip4/native-board-probe/layout.json
            build/flip4/native-board-probe/order.txt
            build/flip4/native-board-probe/qemu-proof.json
            build/flip4/native-board-probe/console-*.log
      - uses: actions/upload-artifact@v4
        with:
          name: flip4-reference-board-candidate
          path: |
            build/flip4/reference-board/document-with-drivers.img
            build/flip4/reference-board/layout.json
            build/flip4/reference-board/order.txt
            build/flip4/reference-board/board.json
            build/flip4/reference-board/kernel.json
            build/flip4/reference-board/merged.dtb
            build/flip4/reference-board/proof.json
            build/flip4/reference-board/console-*.log
  driver-modules:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect normal module loading on the isolated reference kernel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cpio gcc libc6-dev mkbootimg qemu-system-arm
          mkdir -p build/flip4
          curl -fsSL --retry 3 https://github.com/rainbowdashh/android_device_samsung_b4q/releases/download/V2/twrp_b4q_V2.img -o build/flip4/recovery.img
          echo '2c1690936c2ce795da109d0796cc9b003eebcaa3b2da6dbc016e1c2331d0ee84  build/flip4/recovery.img' | sha256sum -c -
          python3 tests/flip4_module_probe.py build/flip4/recovery.img build/flip4/driver-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip4-reference-driver-probe
          path: build/flip4/driver-probe/
  model:
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flip4-virtual-disk
          path: build/flip4
      - run: sudo apt-get update -qq && sudo apt-get install -y qemu-system-arm e2fsprogs
      - run: |
          cd build/flip4
          sha256sum -c SHA256SUMS
          cp starter.raw work.raw
          cp starter.raw offline.raw
          printf '%s\n' "장보기 메모에 '사과 두 개' 추가해 줘." '메모 보여줘' '' |
            timeout 60s python3 flip4_model.py offline.raw --offline --interactive > offline.jsonl
          jq -se 'length == 2 and .[0].text == "장보기\n사과 두 개" and .[0] == .[1]' offline.jsonl
          if timeout 60s python3 flip4_model.py offline.raw --offline --instruction "메모 삭제해 줘" > /dev/null 2> reject.log; then exit 1; fi
          grep -F 'AIOS_REJECT invalid-request' reject.log
          timeout 60s python3 flip4_model.py offline.raw --show > offline-reopened.json
          tail -1 offline.jsonl | cmp - offline-reopened.json
          bash ../../scripts/with-local-model.sh bash -eu <<'CHECK'
          timeout 180s python3 ../../tests/flip4_disk.py . work.raw .
          timeout 180s python3 flip4_model.py work.raw --instruction "메모 끝에 '빵' 한 줄을 추가해 줘." > edited.json
          timeout 60s python3 flip4_model.py work.raw --show > reopened.json
          cmp edited.json reopened.json
          jq -e '.text == "장보기\n우유\n전원 중단 검증\n빵"' reopened.json
          sha256sum -c SHA256SUMS
          CHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip4-model-result
          path: |
            build/flip4/proof.json
            build/flip4/offline.jsonl
            build/flip4/disk-*.log
  guest-model:
    needs: probe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flip4-virtual-disk
          path: build/flip4
      - uses: actions/download-artifact@v4
        with:
          name: flip4-reference-unsigned
          path: build/flip4/reference-image
      - run: sudo apt-get update -qq && sudo apt-get install -y cpio gcc libc6-dev qemu-system-arm e2fsprogs mkbootimg ninja-build parted
      - run: bash scripts/flip4-model-disk.sh build/flip4 build/flip4/split-model-starter.raw
      - name: Infer and save in the disconnected ARM64 guest
        run: |
          cd build/flip4
          cp --sparse=always split-model-starter.raw inference-work.raw
          printf '%s\n' "장보기 메모에 '사과 두 개' 추가해 줘." "메모에 '우유'를 적어줘." "메모 보여줘" '' |
            timeout 600s python3 flip4_model.py inference-work.raw --split-disk --guest-model --interactive > inferred.jsonl 2> usage.json
          jq -se 'length == 3 and .[0].text == "장보기\n사과 두 개" and .[1].text == "장보기\n사과 두 개\n우유" and .[1] == .[2]' inferred.jsonl
          jq -se 'length == 1 and .[0].model_peak_rss_kib > 0 and .[0].inference_ms > 0' usage.json
          timeout 60s python3 flip4_model.py inference-work.raw --split-disk --show > reopened.json
          tail -1 inferred.jsonl | cmp - reopened.json
          system_sha() { dd if="$1" bs=1M skip=1 count=768 status=none | sha256sum; }
          system_sha split-model-starter.raw > system.sha256
          system_sha inference-work.raw | cmp - system.sha256
      - name: Infer from the extracted Android v2 image and reopen the saved document
        run: |
          bundle=build/flip4
          proof="$bundle/reference-model"
          mkdir -p "$proof"
          unpack_bootimg --boot_img "$bundle/reference-image/aios-flip4-document-reference-unsigned.img" --out "$proof/payload"
          cp --sparse=always "$bundle/split-model-starter.raw" "$proof/work.raw"
          timeout 300s python3 tests/flip4_split_disk.py "$bundle" "$proof/work.raw" "$proof/payload" --guest-model > "$proof/proof.json"
          jq -e --slurpfile layout "$bundle/reference-image/document-layout.json" '
            .boot_payload.kernel == $layout[0].sections.kernel.sha256 and
            .boot_payload.ramdisk == $layout[0].sections.ramdisk.sha256
          ' "$proof/proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip4-reference-model-proof
          path: |
            build/flip4/reference-model/proof.json
            build/flip4/reference-model/console-*.log
      - name: Boot the driver-enabled reference image with the local model
        run: |
          bundle=build/flip4
          proof="$bundle/reference-drivers-model"
          recovery="$bundle/recovery.img"
          mkdir -p "$proof"
          curl -fsSL --retry 3 https://github.com/rainbowdashh/android_device_samsung_b4q/releases/download/V2/twrp_b4q_V2.img -o "$recovery"
          echo "2c1690936c2ce795da109d0796cc9b003eebcaa3b2da6dbc016e1c2331d0ee84  $recovery" | sha256sum -c -
          bash scripts/flip4-reference-image.sh --driver-image "$recovery" "$bundle/reference-model/payload/ramdisk" "$proof"
          cp --sparse=always "$bundle/split-model-starter.raw" "$proof/work.raw"
          timeout 300s python3 tests/flip4_split_disk.py "$bundle" "$proof/work.raw" "$proof/payload" \
            --guest-model --driver-order "$proof/order.txt" > "$proof/proof.json"
          jq -e --slurpfile layout "$proof/layout.json" '
            .boot_payload.kernel == $layout[0].sections.kernel.sha256 and
            .boot_payload.ramdisk == $layout[0].sections.ramdisk.sha256 and
            (.drivers_loaded_each_boot | length) == 80
          ' "$proof/proof.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flip4-reference-drivers-model-proof
          path: |
            build/flip4/reference-drivers-model/proof.json
            build/flip4/reference-drivers-model/layout.json
            build/flip4/reference-drivers-model/console-*.log
      - uses: actions/upload-artifact@v4
        with:
          name: flip4-guest-inference
          path: |
            build/flip4/inferred.jsonl
            build/flip4/usage.json
            build/flip4/system.sha256
      - run: cd build/flip4 && sha256sum split-model-starter.raw > MODEL_SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: flip4-guest-model-disk
          retention-days: 7
          path: |
            build/flip4/split-model-starter.raw
            build/flip4/MODEL_SHA256SUMS
