name: Bootable document runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO and virtual machine tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends grub-pc-bin grub-common xorriso mtools squashfs-tools btrfs-progs qemu-system-x86 seabios
          if test -c /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Build live runtime ISO
        run: bash scripts/runtime-iso.sh
      - name: Edit and reopen a virtual document disk
        run: python3 tests/runtime_iso.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aios-x86_64-document-runtime
          path: build/runtime/
