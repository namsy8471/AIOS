name: Bootable document runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO and virtual machine tools
        run: |
          sources="$RUNNER_TEMP/runtime-packages.list"
          for suite in noble noble-updates noble-security; do
            echo "deb https://archive.ubuntu.com/ubuntu $suite main universe" >> "$sources"
          done
          options=(-o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-
                   -o Acquire::Retries=1 -o Acquire::https::Timeout=20)
          sudo apt-get "${options[@]}" update -qq
          sudo apt-get "${options[@]}" install -y --no-install-recommends grub-pc-bin grub-common xorriso mtools squashfs-tools btrfs-progs qemu-system-x86 seabios
          if test -c /dev/kvm; then sudo chmod a+rw /dev/kvm; fi
      - name: Install user-space virtio-vsock backend
        run: cargo install --locked vhost-device-vsock --version 0.3.0
      - name: Build live runtime ISO
        run: bash scripts/runtime-iso.sh
      - name: Edit and reopen a virtual document disk
        run: python3 tests/runtime_iso.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: aios-x86_64-document-runtime
          path: build/runtime/
